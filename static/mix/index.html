<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>RC Bridge — Mix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button id="btn-back" class="back-btn" hidden aria-label="Back">←</button>
  <div class="title">
    <h1 id="view-title">Mix</h1>
    <span id="view-sub" class="sub">connecting…</span>
  </div>
  <div id="status-pill" class="status-pill status-pending">
    <span class="status-dot"></span>
    <span class="status-text" id="status-text">offline</span>
  </div>
</header>

<main id="main" class="main">
  <section id="view-loading" class="view">
    <p class="muted">Connecting to the bridge…</p>
  </section>
  <section id="view-error" class="view" hidden>
    <p class="err" id="error-text"></p>
  </section>
  <section id="view-tracks" class="view" hidden>
    <ul id="track-list" class="track-list"></ul>
  </section>
  <section id="view-track" class="view" hidden>
    <div class="card">
      <h2 id="track-title">—</h2>
      <div class="row">
        <label class="lbl">Volume</label>
        <input type="range" id="track-volume" min="0" max="1" step="0.001" value="0">
        <span class="val" id="track-volume-val">0.00</span>
      </div>
      <div class="row">
        <label class="lbl">Pan</label>
        <input type="range" id="track-pan" min="-1" max="1" step="0.001" value="0">
        <span class="val" id="track-pan-val">0.00</span>
      </div>
      <div class="row toggles">
        <button id="track-mute" class="toggle" aria-pressed="false">Mute</button>
        <button id="track-solo" class="toggle" aria-pressed="false">Solo</button>
      </div>
    </div>
    <div class="card" id="sends-card">
      <h3>Sends</h3>
      <div id="sends-body" class="sends-body"><p class="muted">No sends.</p></div>
    </div>
    <div class="card">
      <h3>Devices</h3>
      <ul id="device-list" class="device-list"></ul>
    </div>
  </section>
  <section id="view-device" class="view" hidden>
    <div class="card">
      <h2 id="device-title">—</h2>
      <p class="muted" id="device-sub"></p>
      <div id="param-list" class="param-list"></div>
    </div>
  </section>
</main>

<footer id="toast" class="toast" hidden></footer>

<script type="module" src="app.js"></script>
</body>
</html>
