<!DOCTYPE html>
<html><head>
  <script>
    (function() {
      const originalLog = console.log;
      const originalWarn = console.warn;
      const originalError = console.error;

      function sendLogToServer(level, ...args) {
        if (level === 'error') originalError.apply(console, args);
        else if (level === 'warn') originalWarn.apply(console, args);
        else originalLog.apply(console, args);

        const parts = args.map(arg => {
          if (arg instanceof Error) return arg.message + '\n' + arg.stack;
          if (typeof arg === 'object') {
            try { return JSON.stringify(arg); } catch (e) { return String(arg); }
          }
          return String(arg);
        });

        fetch('/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            level: level,
            parts: parts,
            url: window.location.href
          })
        }).catch(() => {});
      }

      console.log = (...args) => sendLogToServer('log', ...args);
      console.warn = (...args) => sendLogToServer('warn', ...args);
      console.error = (...args) => sendLogToServer('error', ...args);

      window.onerror = function(message, source, lineno, colno, error) {
        sendLogToServer('error', message, `at ${source}:${lineno}:${colno}`, error);
      };
      
      window.onunhandledrejection = function(event) {
        sendLogToServer('error', 'Unhandled Promise Rejection:', event.reason);
      };
    })();
  </script>

<style>
*,*::before,*::after{box-sizing:border-box}*{margin:0}
:root{
  --bg: #1c1c1e;
  --bg2: #121214;
  --text: #f5f5f7;
  --text2: #8e8e93;
  --ctrl: #2c2c2e;
  --border: #2c2c2e;

html{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:11px;height:100%}
body{padding:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.title-section h1{font-size:13px;font-weight:700;letter-spacing:0.2px;color:var(--text)}

.main{display:flex;flex:1;min-height:0;overflow:hidden;background:var(--bg)}

.header{gap:12px;min-height:48px}
.header-actions{gap:8px;min-width:0;flex-wrap:wrap;justify-content:flex-end}

.panel-scroll{scrollbar-width:thin;scrollbar-color:#3a3a3c transparent}

.settings-panel h3{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setting-row{align-items:flex-start;min-width:0;flex-wrap:wrap}
.setting-row label{padding-top:4px}
.range-sliders{min-width:0;flex:1 1 170px}
.slider-group{min-width:0}

  .right{grid-column:1 / -1;border-top:1px solid var(--border)}

  .footer{padding:8px 10px}
}

  body{overflow:hidden}
  .header{padding:8px;gap:8px}
  .header-actions{gap:6px}
  .main{overflow-y:auto;grid-template-columns:1fr;grid-template-rows:minmax(150px,auto) minmax(220px,auto) minmax(260px,auto)}
  .panel{min-height:0;border-right:0}
  .left,.middle,.right{border-right:0;border-bottom:1px solid var(--border)}
  .right{grid-column:auto;border-top:0}
  .settings-panel{min-height:220px}
  .footer{gap:8px}
  .footer-info{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

<script>
function send(v){const m={method:"close_and_send",params:[v]};if(window.webkit?.messageHandlers?.live)window.webkit.messageHandlers.live.postMessage(m);else if(window.chrome?.webview)window.chrome.webview.postMessage(m);}

window.onerror = function(message, source, lineno, colno, error) {
  const errText = 'ERR: ' + message + ' (' + lineno + ':' + colno + ')';
  const statusEl = document.getElementById('status-info');
  if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">' + errText + '</span>';
  console.error(errText);
};

const targets = window.allTargets;
const mappings = window.currentMappings;
const liveControls = window.liveControls;
const connectedClients = window.connectedClients;
const allSeenClients = window.allSeenClients;

function updateClientsDropdown() {
  const select = document.getElementById('sel-client');
  if (!select) return;
  
  const clientsArr = [...connectedClients.entries()].sort((a,b) => a[0].localeCompare(b[0]));
  const sigConnected = clientsArr.map(([cid, c]) => `${cid}:${c.status}:${c.user_agent}:${c.display_name||''}`).join(';');
  const stickyOnline = connectedClients.has(window.stickySelectedClient);
  const sig = `${sigConnected}|sticky:${window.stickySelectedClient}:${stickyOnline}`;
  
  if (window.lastClientsSignature === sig) {
    return; // Prevent dropdown flickering
  }
  window.lastClientsSignature = sig;
  
  select.innerHTML = '';
  
  if (clientsArr.length === 0 && !window.stickySelectedClient) {
    const opt = document.createElement('option');
    opt.value = "";
    opt.textContent = "Waiting for connection...";
    select.appendChild(opt);
    window.selectedClient = null;
    return;
  }
  
  for (const [cid, client] of clientsArr) {
    const opt = document.createElement('option');
    opt.value = cid;
    opt.textContent = window.getFriendlyClientName(client);
    select.appendChild(opt);
  }
  
  if (window.stickySelectedClient && !connectedClients.has(window.stickySelectedClient)) {
    const clientInfo = allSeenClients.get(window.stickySelectedClient);
    const label = clientInfo ? window.getFriendlyClientName(clientInfo) : `Device (${window.stickySelectedClient.slice(0,6)})`;
    const opt = document.createElement('option');
    opt.value = window.stickySelectedClient;
    opt.textContent = label + " [Offline]";
    select.appendChild(opt);
  }
  
  if (window.stickySelectedClient && [...select.options].some(o => o.value === window.stickySelectedClient)) {
    select.value = window.stickySelectedClient;
    window.selectedClient = window.stickySelectedClient;
  } else if (clientsArr.length > 0) {
    const defaultCid = clientsArr[0][0];
    select.value = defaultCid;
    window.selectedClient = defaultCid;
    window.stickySelectedClient = defaultCid;
  } else {
    window.selectedClient = null;
  }
}

function updateLiveValueDOM(name, val) {
  const row = document.querySelector(`.ctrl-row[data-ctrl="${name}"]`);
  if (!row) return;
  
  row.classList.add('active-activity');
  
  let valEl = row.querySelector('.ctrl-live-val');
  if (!valEl) {
    valEl = document.createElement('span');
    valEl.className = 'ctrl-live-val';
    const targetEl = row.querySelector('.ctrl-target') || row.querySelector('.unmap-btn');
    if (targetEl) {
      row.insertBefore(valEl, targetEl);
    } else {
      row.appendChild(valEl);
    }
  }
  valEl.textContent = val.toFixed(2);
}

function fetchData() {
  window.fetchCoreData(
    // onTargets
    () => {
      renderTargets();
    },
    // onMappings
    () => {
      renderControls();
      updateSettings();
      renderTargets();
    },
    // onClients
    () => {
      updateClientsDropdown();
    }
  );
}

function connectWS() {
  const wsProto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const search = typeof window !== 'undefined' && window.location ? window.location.search : '';
  const token = typeof URLSearchParams !== 'undefined' ? new URLSearchParams(search).get('token') : null;
  const tokenQuery = token ? '?token=' + encodeURIComponent(token) : '';
  const wsUrl = wsProto + '://' + window.location.host + '/admin/ws' + tokenQuery;
  
  window.connectCoreWS(
    wsUrl,
    // onOpen
    () => {
      document.getElementById('status-info').textContent = 'Connected (Live updates)';
      fetchData();
      loadPresetsList();
    },
    // onClose
    () => {
      document.getElementById('status-info').textContent = 'Disconnected';
    },
    // onClientUpdate
    (msg) => {
      updateClientsDropdown();
      const cid = msg.client?.client_id;
      if (cid === window.selectedClient) {
        renderControls();
      }
    }
  );
}

connectWS();

setInterval(() => {
  const now = Date.now();
  for (const [key, state] of liveControls.entries()) {
    if (now - state.ts >= 2000) {
      liveControls.delete(key);
      const parts = key.split('::');
      if (parts.length === 2) {
        const cid = parts[0];
        const name = parts[1];
        if (cid === window.selectedClient) {
          const row = document.querySelector(`.ctrl-row[data-ctrl="${name}"]`);
          if (row) {
            row.classList.remove('active-activity');
            const valEl = row.querySelector('.ctrl-live-val');
            if (valEl) valEl.remove();
          }
        }
      }
    }
  }
}, 1000);

function getMapping(name) {
  const key = window.getMappingKey(window.selectedClient, name);
  return mappings[key] || null;
}

function findMappingForTarget(tgt) {
  for (const [ctrlName, list] of Object.entries(mappings)) {
    if (Array.isArray(list)) {
      for (const m of list) {
        if (m.type === tgt.type && m.trackIndex === tgt.trackIndex) {
          if (tgt.type === 'mixer_send' && m.sendIndex !== tgt.sendIndex) continue;
          if (tgt.type === 'device_param' && (m.deviceIndex !== tgt.deviceIndex || m.paramIndex !== tgt.paramIndex)) continue;
          return ctrlName;
        }
      }
    }
  }
  return null;
}

function targetLabel(t) {
  return window.targetLabel(t, targets);
}

function saveMacroMappings(ctrl) {
  const mapKey = getMappingKey(selectedClient, ctrl);
  sendWS('setMapping', { control: mapKey, targets: mappings[mapKey] }, (res) => {
    if (res.ok) {
      document.getElementById('status-info').textContent = 'Settings saved';
    } else {
      document.getElementById('status-info').innerHTML = '<span style="color:var(--red)">Error saving settings</span>';
    }
  });
  renderControls();
  renderTargets();
}

function removeMacroTarget(ctrl, idx) {
  const mapKey = getMappingKey(selectedClient, ctrl);
  const list = mappings[mapKey];
  if (!list) return;
  list.splice(idx, 1);
  if (list.length === 0) {
    delete mappings[mapKey];
    sendWS('removeMapping', { control: mapKey }, (res) => {
      if (res.ok) {
        document.getElementById('status-info').textContent = 'Mapping removed: ' + mapKey;
      }
    });
    if (selectedControl === ctrl) selectedControl = null;
  } else {
    saveMacroMappings(ctrl);
  }
  renderControls();
  updateSettings();
  renderTargets();
}

function invertMacroTarget(ctrl, idx) {
  const mapKey = getMappingKey(selectedClient, ctrl);
  const list = mappings[mapKey];
  if (!list) return;
  const m = list[idx];
  if (!m) return;
  const temp = m.outMin ?? 0;
  m.outMin = m.outMax ?? 1;
  m.outMax = temp;
  saveMacroMappings(ctrl);
  updateSettings();
}

function updateSettings() {
  const noEl = document.getElementById('no-settings');
  const contentEl = document.getElementById('settings-content');
  const mapKey = selectedControl ? getMappingKey(selectedClient, selectedControl) : null;
  const list = mapKey ? mappings[mapKey] : null;
  if (!list || !Array.isArray(list) || list.length === 0) {
    noEl.style.display = '';
    contentEl.style.display = 'none';
    return;
  }
  noEl.style.display = 'none';
  contentEl.style.display = '';
  
  let html = '<div class="settings-header"><h3 id="settings-ctrl-name">' + mapKey + ' (' + list.length + ' targets)</h3></div>';
  
  list.forEach((m, idx) => {
    const minVal = Math.round((m.outMin ?? 0) * 100);
    const maxVal = Math.round((m.outMax ?? 1) * 100);
    const smoothVal = Math.round((m.smooth ?? 0) * 100);
    const bpmChecked = m.smoothBpmSync ? 'checked' : '';
    const subdivVal = String(m.smoothBpmSubdivision ?? 1);
    
    html += `
      <div class="macro-target-card" style="border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:8px;background:rgba(255,255,255,0.02)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.03);padding-bottom:4px;">
          <strong style="color:var(--accent);font-size:10px;">${targetLabel(m)}</strong>
          <button class="btn" onclick="removeMacroTarget('${selectedControl}', ${idx})" style="height:16px;line-height:12px;padding:0 6px;border-radius:3px;background:rgba(255,69,58,0.1);color:var(--red);border-color:rgba(255,69,58,0.2);">Remove</button>
        </div>
        <div class="setting-row">
          <label>Range</label>
          <div class="range-sliders">
            <div class="slider-group">
              <span>Min</span>
              <input type="range" class="m-min" data-idx="${idx}" min="0" max="100" value="${minVal}">
              <span class="val">${minVal}%</span>
            </div>
            <div class="slider-group">
              <span>Max</span>
              <input type="range" class="m-max" data-idx="${idx}" min="0" max="100" value="${maxVal}">
              <span class="val">${maxVal}%</span>
            </div>
          </div>
          <button class="btn" onclick="invertMacroTarget('${selectedControl}', ${idx})" style="margin-left:4px;height:24px;border-radius:4px;padding:0 8px;">Invert</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;border-top:1px solid rgba(255,255,255,0.03);padding-top:8px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <label class="checkbox-label" style="font-weight:600;">
              <input type="checkbox" class="m-bpm-sync" data-idx="${idx}" ${bpmChecked}>
              BPM Sync
            </label>
          </div>
          <div class="row-subdiv" style="display:${m.smoothBpmSync ? 'flex' : 'none'};align-items:center;gap:8px;width:100%;">
            <span style="font-size:10px;color:var(--text2);width:45px;flex-shrink:0;">Division</span>
            <select class="m-subdiv" data-idx="${idx}" style="background:var(--ctrl);color:var(--text);border:1px solid var(--border);border-radius:4px;flex:1;height:24px;outline:none;font-size:10px;cursor:pointer;padding:0 4px;">
              <option value="0.0625" ${subdivVal==='0.0625'?'selected':''}>1/16 Beat</option>
              <option value="0.125" ${subdivVal==='0.125'?'selected':''}>1/8 Beat</option>
              <option value="0.25" ${subdivVal==='0.25'?'selected':''}>1/4 Beat</option>
              <option value="0.5" ${subdivVal==='0.5'?'selected':''}>1/2 Beat</option>
              <option value="1" ${subdivVal==='1'?'selected':''}>1 Beat</option>
              <option value="2" ${subdivVal==='2'?'selected':''}>2 Beats</option>
              <option value="4" ${subdivVal==='4'?'selected':''}>4 Beats</option>
              <option value="8" ${subdivVal==='8'?'selected':''}>8 Beats</option>
            </select>
          </div>
          <div class="row-smooth" style="display:${m.smoothBpmSync ? 'none' : 'flex'};align-items:center;gap:8px;width:100%;">
            <span style="font-size:10px;color:var(--text2);width:45px;flex-shrink:0;">Smooth</span>
            <input type="range" class="m-smooth" data-idx="${idx}" min="0" max="95" value="${smoothVal}" step="5" style="flex:1;height:4px;accent-color:var(--accent);cursor:pointer;background:#2d2d2f;border-radius:2px;outline:none;">
            <span class="val" style="font-size:10px;color:var(--accent);width:30px;text-align:right;font-family:monospace;">${smoothVal}%</span>
          </div>
        </div>
      </div>
    `;
  });
  
  contentEl.innerHTML = html;
  
  contentEl.querySelectorAll('.m-min, .m-max, .m-smooth').forEach(el => {
    el.addEventListener('input', function() {
      const valEl = this.nextElementSibling;
      valEl.textContent = this.value + '%';
    });
    el.addEventListener('change', function() {
      const idx = parseInt(this.dataset.idx);
      const m = list[idx];
      if (!m) return;
      if (this.classList.contains('m-min')) m.outMin = parseInt(this.value)/100;
      if (this.classList.contains('m-max')) m.outMax = parseInt(this.value)/100;
      if (this.classList.contains('m-smooth')) m.smooth = parseInt(this.value)/100;
      
      saveMacroMappings(selectedControl);
    });
  });
  
  contentEl.querySelectorAll('.m-bpm-sync').forEach(el => {
    el.addEventListener('change', function() {
      const idx = parseInt(this.dataset.idx);
      const m = list[idx];
      if (!m) return;
      m.smoothBpmSync = this.checked;
      
      const card = this.closest('.macro-target-card');
      card.querySelector('.row-subdiv').style.display = this.checked ? 'flex' : 'none';
      card.querySelector('.row-smooth').style.display = this.checked ? 'none' : 'flex';
      
      saveMacroMappings(selectedControl);
    });
  });
  
  contentEl.querySelectorAll('.m-subdiv').forEach(el => {
    el.addEventListener('change', function() {
      const idx = parseInt(this.dataset.idx);
      const m = list[idx];
      if (!m) return;
      m.smoothBpmSubdivision = parseFloat(this.value);
      
      saveMacroMappings(selectedControl);
    });
  });
}

function renderControls() {
  const el = document.getElementById('controls-list');
  let html = '';
  for (const group of phoneControls) {
    html += '<div class="group-label">'+group.group+'</div>';
    for (const name of group.items) {
      const mInfo = getMappingForControl(name);
      const sel = selectedControl === name;
      
      const liveKey = selectedClient + '::' + name;
      const live = liveControls.get(liveKey);
      let activeClass = '';
      let liveText = '';
      if (live) {
        activeClass = ' active-activity';
        liveText = '<span class="ctrl-live-val">' + live.val.toFixed(2) + '</span>';
      }

      const isMapped = mInfo !== null;
      const cls = 'ctrl-row' + (sel ? ' selected' : '') + (isMapped ? ' mapped' : '') + activeClass;
      
      let tgtText = '';
      if (isMapped) {
        tgtText = targetLabel(mInfo.targets[0]);
        if (mInfo.targets.length > 1) {
          tgtText += ' (+' + (mInfo.targets.length - 1) + ')';
        }
        if (mInfo.isClientSpecific) {
          tgtText = '👤 ' + tgtText;
        } else {
          tgtText = '🌍 ' + tgtText;
        }
      }
      
      html += '<div class="'+cls+'" data-ctrl="'+name+'">';
      html += '<span class="ctrl-indicator"></span>';
      html += '<span class="ctrl-name">'+name+'</span>';
      html += liveText;
      if (isMapped) html += '<span class="ctrl-target" title="'+tgtText+'">'+tgtText+'</span>';
      if (isMapped) html += '<button class="unmap-btn" data-unmap="'+(isMapped ? mInfo.key : name)+'">✕</button>';
      html += '</div>';
    }
  }
  el.innerHTML = html;
  el.querySelectorAll('.ctrl-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('unmap-btn')) return;
      selectedControl = row.dataset.ctrl;
      renderControls();
      updateSettings();
      renderTargets();
      document.getElementById('target-hint').textContent = 'mapping: ' + selectedControl;
    });
  });
  el.querySelectorAll('.unmap-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.dataset.unmap;
      delete mappings[key];
      sendWS('removeMapping', { control: key }, (res) => {
        if (res.ok) {
          document.getElementById('status-info').textContent = 'Mapping removed: ' + key;
        } else {
          document.getElementById('status-info').innerHTML = '<span style="color:var(--red)">Error removing mapping</span>';
        }
      });
      const baseName = key.includes('::') ? key.split('::')[1] : key;
      if (selectedControl === baseName) {
        selectedControl = null;
      }
      renderControls();
      updateSettings();
      renderTargets();
    });
  });
}

function doMap(target) {
  if (!selectedControl) return;
  target.label = targetLabel(target);
  
  const mapKey = getMappingKey(selectedClient, selectedControl);
  
  if (!mappings[mapKey]) {
    mappings[mapKey] = [];
  }
  
  const idx = mappings[mapKey].findIndex(x => 
    x.type === target.type && x.trackIndex === target.trackIndex &&
    (target.type === 'mixer_send' ? x.sendIndex === target.sendIndex : true) &&
    (target.type === 'device_param' ? (x.deviceIndex === target.deviceIndex && x.paramIndex === target.paramIndex) : true)
  );
  
  if (idx === -1) {
    target.outMin = 0;
    target.outMax = 1;
    target.smooth = 0;
    target.smoothBpmSync = false;
    target.smoothBpmSubdivision = 1;
    mappings[mapKey].push(target);
  }
  
  sendWS('setMapping', { control: mapKey, targets: mappings[mapKey] }, (res) => {
    if (res.ok) {
      document.getElementById('status-info').textContent = 'Mapping added: ' + mapKey;
    } else {
      document.getElementById('status-info').innerHTML = '<span style="color:var(--red)">Error saving mapping</span>';
    }
  });
  
  renderControls();
  updateSettings();
  renderTargets();
}

function renderTargets() {
  const el = document.getElementById('targets-tree');
  const searchInput = document.getElementById('target-search');
  const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
  const clearSearchBtn = document.getElementById('btn-clear-search');
  if (clearSearchBtn) {
    clearSearchBtn.style.display = query ? 'block' : 'none';
  }

  let html = '';

  if (query) {
    let matches = [];
    
    // Check Song Tempo
    if ('song tempo'.includes(query) || 'bpm'.includes(query)) {
      const mappedCtrl = findMappingForTarget({ type: 'tempo' });
      const badge = mappedCtrl ? '<span class="mapped-badge">'+mappedCtrl+'</span>' : '';
      matches.push({
        label: 'Song Tempo (20-300 BPM) ' + badge,
        tgt: { type: 'tempo' },
        icon: '🎵'
      });
    }

    for (const t of targets) {
      if (typeof t.trackIndex !== 'number') continue;
      
      if (t.mixer) {
        for (const mp of t.mixer) {
          const matchLabel = (t.name + ' ' + mp.label).toLowerCase();
          if (matchLabel.includes(query)) {
            const mpTgt = { type: mp.type, trackIndex: mp.trackIndex, sendIndex: mp.sendIndex };
            const mappedCtrl = findMappingForTarget(mpTgt);
            const badge = mappedCtrl ? '<span class="mapped-badge">'+mappedCtrl+'</span>' : '';
            const icon = mp.type.includes('mute')||mp.type.includes('solo')||mp.type.includes('arm') ? '⚡' : '🎛';
            matches.push({
              label: t.name + ' → ' + mp.label + ' ' + badge,
              tgt: mpTgt,
              icon: icon
            });
          }
        }
      }

      if (t.devices) {
        for (const dev of t.devices) {
          for (const p of dev.params) {
            const matchLabel = (t.name + ' ' + dev.name + ' ' + p.label).toLowerCase();
            if (matchLabel.includes(query)) {
              const paramTgt = { type: 'device_param', trackIndex: p.trackIndex, deviceIndex: p.deviceIndex, paramIndex: p.paramIndex };
              const mappedCtrl = findMappingForTarget(paramTgt);
              const badge = mappedCtrl ? '<span class="mapped-badge">'+mappedCtrl+'</span>' : '';
              matches.push({
                label: t.name + ' → ' + dev.name + ' → ' + p.label + ' ' + badge,
                tgt: paramTgt,
                icon: '⬡'
              });
            }
          }
        }
      }
    }

    if (matches.length > 0) {
      for (const m of matches) {
        html += '<div class="target-item" data-tgt=\'' + JSON.stringify(m.tgt) + '\'><span class="icon">' + m.icon + '</span><span class="name">' + m.label + '</span></div>';
      }
    } else {
      html += '<div class="empty-msg">No matching targets found</div>';
    }
  } else {
    // Tree rendering
    const tempoTgt = { type: 'tempo' };
    const mappedTempo = findMappingForTarget(tempoTgt);
    const tempoBadge = mappedTempo ? '<span class="mapped-badge">'+mappedTempo+'</span>' : '';
    html += '<div class="target-item" data-tgt=\'{"type":"tempo"}\'><span class="icon">🎵</span><span class="name">Song Tempo (20-300 BPM)'+tempoBadge+'</span></div>';
    
    for (const t of targets) {
      if (typeof t.trackIndex !== 'number') continue;
      html += '<div class="target-section">';
      html += '<div class="target-header" data-toggle="trk-'+t.trackIndex+'"><span class="arrow" id="arrow-trk-'+t.trackIndex+'">▶</span><span>🎚 '+t.name+'</span></div>';
      html += '<div class="target-children" id="trk-'+t.trackIndex+'">';
      if (t.mixer) {
        for (const mp of t.mixer) {
          const mpTgt = {type:mp.type,trackIndex:mp.trackIndex,sendIndex:mp.sendIndex};
          const mappedCtrl = findMappingForTarget(mpTgt);
          const badge = mappedCtrl ? '<span class="mapped-badge">'+mappedCtrl+'</span>' : '';
          const icon = mp.type.includes('mute')||mp.type.includes('solo')||mp.type.includes('arm') ? '⚡' : '🎛';
          html += '<div class="target-item" data-tgt=\''+JSON.stringify(mpTgt)+'\' ><span class="icon">'+icon+'</span><span class="name">'+mp.label+badge+'</span></div>';
        }
      }
      if (t.devices) {
        for (const dev of t.devices) {
          html += '<div class="device-header" data-toggle="dev-'+t.trackIndex+'-'+dev.index+'"><span class="arrow" id="arrow-dev-'+t.trackIndex+'-'+dev.index+'">▶</span>🔌 '+dev.name+'</div>';
          html += '<div class="device-children" id="dev-'+t.trackIndex+'-'+dev.index+'">';
          for (const p of dev.params) {
            const paramTgt = {type:'device_param',trackIndex:p.trackIndex,deviceIndex:p.deviceIndex,paramIndex:p.paramIndex};
            const mappedCtrl = findMappingForTarget(paramTgt);
            const badge = mappedCtrl ? '<span class="mapped-badge">'+mappedCtrl+'</span>' : '';
            html += '<div class="target-item" data-tgt=\''+JSON.stringify(paramTgt)+'\' ><span class="icon">⬡</span><span class="name">'+p.label+badge+'</span></div>';
          }
          html += '</div>';
        }
      }
      html += '</div></div>';
    }
    if (targets.length === 0) {
      html += '<div class="empty-msg">No tracks found. Open a Live Set with tracks and devices.</div>';
    }
  }
  el.innerHTML = html;
  
  el.querySelectorAll('[data-toggle]').forEach(hdr => {
    hdr.addEventListener('click', () => {
      const id = hdr.dataset.toggle;
      const children = document.getElementById(id);
      const arrow = document.getElementById('arrow-'+id);
      if (children) children.classList.toggle('open');
      if (arrow) arrow.classList.toggle('open');
    });
  });
  el.querySelectorAll('.target-item').forEach(item => {
    item.addEventListener('click', () => {
      if (!selectedControl) {
        document.getElementById('status-info').innerHTML = '<span style="color:var(--accent)">Select a control first!</span>';
        return;
      }
      try {
        const tgt = JSON.parse(item.dataset.tgt);
        doMap(tgt);
      } catch(e) {}
    });
  });
}

document.getElementById('sel-client').addEventListener('change', function() {
  selectedClient = this.value;
  stickySelectedClient = this.value;
  renderControls();
  updateSettings();
  renderTargets();
});

// autoSelectEnabled removed

document.getElementById('target-search').addEventListener('input', () => {
  renderTargets();
});

document.getElementById('btn-clear-search').addEventListener('click', () => {
  const searchInput = document.getElementById('target-search');
  searchInput.value = '';
  renderTargets();
});

renderControls();
renderTargets();
updateSettings();

document.getElementById('btn-done').addEventListener('click', () => send('done'));
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('Are you sure you want to clear all mappings?')) return;
  for (const k of Object.keys(mappings)) delete mappings[k];
  selectedControl = null;
  sendWS('clearMappings', {}, (res) => {
    if (res.ok) {
      document.getElementById('status-info').textContent = 'All mappings cleared';
    } else {
      document.getElementById('status-info').innerHTML = '<span style="color:var(--red)">Error clearing mappings</span>';
    }
  });
  renderControls();
  updateSettings();
  renderTargets();
});

function loadPresetsList() {
  sendWS('listPresets', {}, (res) => {
    if (res.ok && res.result) {
      const select = document.getElementById('sel-preset');
      if (!select) return;
      select.innerHTML = '';
      
      const presets = res.result.presets || [];
      const current = res.result.current || 'Default';
      
      const defOpt = document.createElement('option');
      defOpt.value = 'Default';
      defOpt.textContent = 'Default';
      if (current === 'Default') defOpt.selected = true;
      select.appendChild(defOpt);
      
      presets.forEach(p => {
        if (p === 'Default') return;
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        if (p === current) opt.selected = true;
        select.appendChild(opt);
      });
    }
  });
}

document.getElementById('sel-preset').addEventListener('change', function() {
  const val = this.value;
  if (!val) return;
  sendWS('loadPreset', { name: val }, (res) => {
    if (res.ok) {
      document.getElementById('status-info').textContent = 'Loaded preset: ' + val;
      fetchData(); 
    } else {
      document.getElementById('status-info').innerHTML = '<span style="color:var(--red)">Failed to load preset</span>';
    }
  });
});

document.getElementById('btn-save-preset').addEventListener('click', function() {
  const name = prompt('Enter a name for the new preset (letters, numbers, underscores only):');
  if (!name) return;
  const sanitized = name.replace(/[^a-zA-Z0-9_\-]/g, '_');
  sendWS('savePreset', { name: sanitized }, (res) => {
    if (res.ok) {
      document.getElementById('status-info').textContent = 'Saved preset: ' + sanitized;
      loadPresetsList();
    } else {
      document.getElementById('status-info').innerHTML = '<span style="color:var(--red)">Failed to save preset</span>';
    }
  });
});

document.getElementById('btn-delete-preset').addEventListener('click', function() {
  const select = document.getElementById('sel-preset');
  const val = select.value;
  if (!val || val === 'Default') {
    alert('Cannot delete the Default preset.');
    return;
  }
  if (!confirm('Are you sure you want to delete preset "' + val + '"?')) return;
  sendWS('deletePreset', { name: val }, (res) => {
    if (res.ok) {
      document.getElementById('status-info').textContent = 'Deleted preset: ' + val;
      loadPresetsList();
      fetchData(); 
    } else {
      document.getElementById('status-info').innerHTML = '<span style="color:var(--red)">Failed to delete preset</span>';
    }
  });
});
