<!DOCTYPE html>
<html><head>
  <script>
    (function() {
      const originalLog = console.log;
      const originalWarn = console.warn;
      const originalError = console.error;

      function sendLogToServer(level, ...args) {
        if (level === 'error') originalError.apply(console, args);
        else if (level === 'warn') originalWarn.apply(console, args);
        else originalLog.apply(console, args);

        const parts = args.map(arg => {
          if (arg instanceof Error) return arg.message + '\n' + arg.stack;
          if (typeof arg === 'object') {
            try { return JSON.stringify(arg); } catch (e) { return String(arg); }
          }
          return String(arg);
        });

        fetch('/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            level: level,
            parts: parts,
            url: window.location.href
          })
        }).catch(() => {});
      }

      console.log = (...args) => sendLogToServer('log', ...args);
      console.warn = (...args) => sendLogToServer('warn', ...args);
      console.error = (...args) => sendLogToServer('error', ...args);

      window.onerror = function(message, source, lineno, colno, error) {
        sendLogToServer('error', message, `at ${source}:${lineno}:${colno}`, error);
      };
      
      window.onunhandledrejection = function(event) {
        sendLogToServer('error', 'Unhandled Promise Rejection:', event.reason);
      };
    })();
  </script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RC Surface — Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Tab Bar ──────────────────────────────────────────────── -->
<nav class="tab-bar">
  <button class="tab-btn active" data-tab="main">
    <span class="tab-text">Main</span><span class="tab-abbr" title="Main">●</span>
  </button>
  <button class="tab-btn" data-tab="mappings">
    <span class="tab-text">Mappings</span><span class="tab-abbr" title="Mappings">M</span>
    <span class="badge" id="badge-mappings">0</span>
  </button>
</nav>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- TAB 1: Main                                                 -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="tab-content active" id="tab-main">

  <!-- QR Cards -->
  <div class="qr-row" id="qr-row">
    <div class="qr-card">
      <span class="qr-label">Performance</span>
      <div class="qr-frame" id="qr-perf"></div>
      <div class="qr-url" id="url-perf"></div>
      <div class="qr-actions">
        <a class="btn sm" id="open-perf" href="#" target="_blank" style="text-decoration:none">Open</a>
        <a class="btn sm" id="link-admin" href="#" target="_blank" style="text-decoration:none;font-size:9px">admin ↗</a>
      </div>
    </div>
    <div class="qr-card" id="perf-status-card" style="display:none; align-items: stretch; justify-content: flex-start; text-align: left; padding: 12px 16px;">
      <span class="qr-label" style="text-align:center; margin-bottom:4px;">Performance Status</span>
      <div style="display:flex; flex-direction:column; gap:8px; width:100%; font-size:11px;">
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:4px;">
          <span style="color:var(--text2)">Connected Client</span>
          <span id="perf-device" style="font-weight:bold; color:var(--text); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">—</span>
        </div>
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:4px;">
          <span style="color:var(--text2)">Phone Frame Rate</span>
          <span id="perf-fps" style="font-weight:bold; font-family:var(--mono); color:var(--text);">—</span>
        </div>
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:4px;">
          <span style="color:var(--text2)">Command Latency (RTT)</span>
          <span id="perf-rtt" style="font-weight:bold; font-family:var(--mono); color:var(--text);">—</span>
        </div>
        <div style="display:flex; justify-content:space-between; padding-bottom:4px;">
          <span style="color:var(--text2)">MediaPipe Latency</span>
          <span id="perf-mediapipe" style="font-weight:bold; font-family:var(--mono); color:var(--text);">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Not-running placeholder -->
  <div id="qr-placeholder" class="hidden" style="text-align:center;padding:24px;color:var(--text2);font-size:11px">
    Start the server to get QR codes and LAN URLs.
  </div>

  <!-- Connection Status Strip -->
  <div class="conn-strip">
    <div class="pulse-dot" id="conn-pulse"></div>
    <div>
      <div class="conn-count" id="conn-count">0</div>
      <div class="conn-label" id="conn-label">clients</div>
    </div>
    <div class="vu-meter" title="Server CPU usage (saturation = latency risk)">
      <div class="vu-fill" id="vu-fill"></div>
    </div>
  </div>

  <!-- Grouped control categories (click to expand) -->
  <div class="ctrl-groups" id="ctrl-groups"></div>

  <!-- Network summary (migrated from former Interfaces tab) -->
  <div class="section-title" style="margin-top:16px">Network</div>
  <div class="iface-primary" style="margin-bottom:8px">
    <div class="ip" id="iface-primary-ip">—</div>
    <div class="url" id="iface-primary-url">Server not running</div>
    <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn sm" id="copy-primary">Copy URL</button>
    </div>
  </div>
  <!-- Connection Mode — A1 followup: ids ref'd by updateServerUI()
       were dropped along with the Interfaces tab. Restoring them in a
       compact rows block keeps the JS unchanged and the panel stable. -->
  <div class="section-title" style="margin-top:10px">Connection Mode</div>
  <div class="conn-mode" id="conn-mode">
    <div class="conn-mode-row">
      <span class="conn-mode-label">Protocol</span>
      <span class="conn-mode-val" id="mode-proto">HTTP</span>
    </div>
    <div class="conn-mode-row">
      <span class="conn-mode-label">Port</span>
      <span class="conn-mode-val" id="mode-port">—</span>
    </div>
    <div class="conn-mode-row">
      <span class="conn-mode-label">Cert</span>
      <span class="conn-mode-val" id="mode-cert">n/a</span>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- TAB 2: Mappings                                            -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="tab-content" id="tab-mappings">
  <div class="mappings-layout">
    <!-- Left: control list -->
    <div class="map-left">
      <div class="map-search" style="display:flex;gap:6px;margin-bottom:8px">
        <input type="text" id="map-search" placeholder="Search controls…" style="flex:1">
        <button id="btn-project-import" class="btn sm" title="Import .rcsurface">PRJ↑</button>
        <button id="btn-project-export" class="btn sm" title="Export .rcsurface">PRJ↓</button>
        <button id="btn-project-rollback" class="btn sm" title="Rollback project profile">↶</button>
        <select id="map-clear-category" class="btn sm" style="height:26px;flex-shrink:0" aria-label="Mappings to clear"></select>
        <button class="btn sm danger" id="btn-clear" title="Clear mappings for the selected category (asks for confirmation)" style="height:26px;flex-shrink:0">Clear</button>
      </div>
      <div class="map-list" id="map-list"></div>
    </div>
    <!-- Right: detail -->
    <div class="map-right" id="map-right">
      <div class="map-detail-empty" id="map-empty">Select a control to view details</div>
      <div class="map-detail hidden" id="map-detail">
        <h3 id="map-detail-name"></h3>
        <div class="map-live-value">
          <span class="val" id="map-detail-val">0.000</span>
          <div class="sparkline-container">
            <svg viewBox="0 0 120 20" preserveAspectRatio="none">
              <path id="map-detail-spark" d="M0,10"/>
            </svg>
          </div>
        </div>
        <!-- Conflict warning surfaces inline in the detail panel when the user
             picks a target already bound to another control. Replace/Cancel
             keep the action visible without blocking on alert(). -->
        <div id="map-conflict-banner" class="hidden" style="
          display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:4px;margin-bottom:8px;
          background:rgba(255,159,10,0.12);border:1px solid var(--accent,#ff9f0a);font-size:10px;color:var(--text);
        ">
          <span id="map-conflict-msg"></span>
          <div style="display:flex;gap:6px">
            <button class="btn sm" id="map-conflict-cancel" style="flex:1;height:22px;font-size:10px">Cancel</button>
            <button class="btn sm primary" id="map-conflict-replace" style="flex:1;height:22px;font-size:10px">Replace existing</button>
          </div>
        </div>
        <!-- Inline picker: lives in the detail panel so conflict warnings and
             the picker share the same visible space (no modal in the way). -->
        <div id="map-picker" class="hidden">
          <div id="map-picker-toolbar">
            <input type="text" id="map-picker-search" placeholder="Search parameters…">
            <button class="btn sm" id="map-picker-cancel">Cancel</button>
          </div>
          <div id="map-picker-list" class="picker-list"></div>
        </div>
        <div class="bound-targets" id="map-detail-targets"></div>
        <div style="display:flex; gap:8px;">
          <button class="btn primary" id="btn-bind" style="margin-bottom:8px; flex:1;">Bind to…</button>
          <button class="btn primary" id="btn-trigger" style="margin-bottom:8px; flex:1; background:#6b46c1; border-color:#553c9a;">Trigger to…</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- Footer                                                     -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="footer">
  <div class="server-status">
    <span class="server-dot" id="footer-dot"></span>
    <span id="footer-status">—</span>
  </div>
  <button class="btn primary" data-action="start" id="btn-start">Start</button>
  <button class="btn" data-action="stop" id="btn-stop">Stop</button>
  <button class="btn" data-action="restart" id="btn-restart">Restart</button>
  <button class="btn" data-action="refresh" id="btn-refresh">Refresh</button>
  <button class="btn" data-action="close" id="btn-close">Close</button>
</div>

<script src="../admin/mappings-core.js"></script>
<script src="mappings.js"></script>
<script src="qrcode.js"></script>
<script src="app.js"></script>
</body></html>
